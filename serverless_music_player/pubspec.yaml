name: auralis_player
description: A client-side Android music player with offline library and background playback.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  cached_network_image: ^3.4.1
  dio: ^5.11.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.6.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  pointycastle: ^4.0.0
  provider: ^6.1.5+1
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
