# Stable, personal-use signing key so every CI build updates over the previous one.
# This key is intentionally committed: builds must share one signature or Android
# refuses to install over an existing app ("package conflicts").
# If MuZic is ever published, replace this with a private keystore and remove it.
storePassword=MuZicRelease2026
keyPassword=MuZicRelease2026
keyAlias=muzic
storeFile=muzic-release.p12
storeType=PKCS12
