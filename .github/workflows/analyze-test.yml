name: Analyze and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  analyze-test:
    name: Analyze and test the Flutter app
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: serverless_music_player
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart and Flutter packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test
