<text x="360" y="130" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="15" fill="#F2F1F7" font-weight="800" text-anchor="middle">Sleep timer timeline</text><circle cx="242" cy="198" r="9" fill="#9A97AD"/><rect x="240" y="208" width="3" height="62" rx="2" fill="#2B2C42"/><text x="264" y="194" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#F2F1F7" font-weight="700" text-anchor="start">Playing with no activity</text><text x="264" y="212" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#9A97AD" font-weight="500" text-anchor="start">starts counting</text><circle cx="242" cy="280" r="9" fill="#B69CFF"/><rect x="240" y="290" width="3" height="62" rx="2" fill="#2B2C42"/><text x="264" y="276" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#F2F1F7" font-weight="700" text-anchor="start">N minutes later</text><text x="264" y="294" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#9A97AD" font-weight="500" text-anchor="start">warning notification + banner</text><circle cx="242" cy="362" r="9" fill="#B69CFF"/><rect x="240" y="372" width="3" height="62" rx="2" fill="#2B2C42"/><text x="264" y="358" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#F2F1F7" font-weight="700" text-anchor="start">+5 minutes</text><text x="264" y="376" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#9A97AD" font-weight="500" text-anchor="start">still no response?</text><circle cx="242" cy="444" r="9" fill="#7EE7D3"/><text x="264" y="440" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="12.5" fill="#F2F1F7" font-weight="700" text-anchor="start">Playback paused</text><text x="264" y="458" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="10.5" fill="#9A97AD" font-weight="500" text-anchor="start">'Playback paused' notice</text><rect x="214" y="540" width="292" height="76" rx="14" fill="#151623" stroke="#2C2D40" stroke-width="1"/><text x="228" y="564" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="11.5" fill="#F2F1F7" font-weight="700" text-anchor="start">Still listening?</text><text x="228" y="584" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#9A97AD" font-weight="500" text-anchor="start">MuZic pauses in 5 min without</text><text x="228" y="598" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#9A97AD" font-weight="500" text-anchor="start">activity.</text><rect x="412" y="566" width="78" height="26" rx="13" fill="#2B2340" stroke="#4A3F72" stroke-width="1"/><text x="451" y="583" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#B69CFF" font-weight="700" text-anchor="middle">I'm here</text><text x="360" y="650" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#9A97AD" font-weight="500" text-anchor="middle">Any tap · app resume · “I'm here”</text><text x="360" y="666" font-family="Inter,Segoe UI,Roboto,sans-serif" font-size="9.5" fill="#9A97AD" font-weight="500" text-anchor="middle">resets the countdown</text>
