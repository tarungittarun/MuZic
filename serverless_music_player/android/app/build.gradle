plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.auralis.player"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.auralis.player"
        minSdk = 23
        targetSdk = 35
        // Take the version from pubspec.yaml (`version: 1.4.2+7`) through the
        // Flutter Gradle extension. Hard-coding 1/1.0.0 here silently overrode
        // the pubspec, so every earlier APK installed as 1.0.0 (code 1).
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    splits {
        abi {
            enable = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk = false
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                storeType = keystoreProperties['storeType'] ?: 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

dependencies {
    // MediaSessionCompat + NotificationCompat.MediaStyle: MuZic builds and owns
    // its own playback card instead of relying on a plugin's notification.
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
}

flutter {
    source = "../.."
}
