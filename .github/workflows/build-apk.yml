name: Build installable Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: serverless_music_player
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart and Flutter packages
        run: flutter pub get

      - name: Verify signing key
        shell: bash
        run: |
          ls -la android/key.properties
          ls -la android/app/*.p12 || echo "no keystore in android/app/"
          keytool -list -v -keystore android/app/muzic-release.p12 -storetype PKCS12 \
            -storepass MuZicRelease2026 2>&1 | grep -E "Alias name|Valid|Signature algorithm|error" | head -6

      - name: Build per-ABI release APKs
        shell: bash
        run: |
          set +e
          flutter build apk --release --target-platform=android-arm,android-arm64 --split-per-abi 2>&1 | tee build_out.txt
          status=${PIPESTATUS[0]}
          {
            echo '## flutter build apk'
            echo '```'
            tail -80 build_out.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -aE "^e: |^w: |FAILURE:|What went wrong|Caused by|error:|Exception|FAILED|Execution failed|> Task .*FAILED" build_out.txt \
            | grep -av "Unzipping" | head -40 | while IFS= read -r line; do
            echo "::error title=build::${line}"
          done
          exit $status

      - name: Verify APK signature
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            echo "### $apk"
            "$BT/apksigner" verify --print-certs "$apk" 2>&1 | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          done | tee -a "$GITHUB_STEP_SUMMARY"
          "$BT/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>&1 \
            | grep "SHA-256" | head -1 | while IFS= read -r line; do
            echo "::notice title=APK signing certificate::${line}"
          done

      - name: Verify versionName / versionCode
        shell: bash
        run: |
          # Guard against the Gradle file silently overriding the pubspec
          # version: the device only ever sees what is inside the manifest.
          set +e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)
          PUBSPEC_VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          BASE_NAME=${PUBSPEC_VERSION%%+*}
          BASE_CODE=${PUBSPEC_VERSION##*+}
          BADGING=$("$BT/aapt2" dump badging \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk 2>/dev/null \
            | grep -m1 "^package:")
          echo "pubspec=$PUBSPEC_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "badging=$BADGING" >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=APK version::pubspec=${PUBSPEC_VERSION} ${BADGING}"
          code=$(echo "$BADGING" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          name=$(echo "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          # --split-per-abi offsets the version code per ABI (arm64-v8a is
          # 2000 + base), so compare the base inside the offset.
          if [ -z "$code" ] || [ -z "$name" ]; then
            echo "::error title=version-missing::the manifest carries no versionName/versionCode"
            exit 1
          fi
          if [ "$name" != "$BASE_NAME" ] || [ $((code % 1000)) -ne "$BASE_CODE" ]; then
            echo "::error title=version-mismatch::manifest ${name}+${code} but pubspec asks for ${BASE_NAME}+${BASE_CODE}"
            exit 1
          fi
          echo "::notice title=APK version::OK ${name}+${code} (base ${BASE_CODE}) matches pubspec ${PUBSPEC_VERSION}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: muzic-android-apks
          path: serverless_music_player/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish direct APK download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          gh release create "apk-build-${RUN_NUMBER}" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --repo "${GH_REPOSITORY}" \
            --title "MuZic ${VERSION} (APK build ${RUN_NUMBER})" \
            --notes "MuZic version ${VERSION}.

          Install **app-arm64-v8a-release.apk** on nearly all current Android phones (arm64). Use **app-armeabi-v7a-release.apk** only on older 32-bit devices.

          This build installs over previous MuZic builds: it is signed with the same release key as every earlier build, and the version code increases with each release."
