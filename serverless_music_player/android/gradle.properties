org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Reuse task outputs across CI runs (paired with the Gradle cache restored by
# setup-java) and run independent module tasks in parallel.
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableR8.fullMode=true
