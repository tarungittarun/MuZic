name: Build installable Android APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Dart and Flutter packages
        run: flutter pub get

      - name: Build per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: auralis-android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish direct APK download links
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          gh release create "apk-build-${RUN_NUMBER}" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            --repo "${GH_REPOSITORY}" \
            --title "Auralis Android APK build ${RUN_NUMBER}" \
            --notes "Install app-arm64-v8a-release.apk on most current Android phones. Use app-armeabi-v7a-release.apk only on older 32-bit devices. This personal-use build is signed with the project's debug key."
