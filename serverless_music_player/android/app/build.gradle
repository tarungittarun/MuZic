plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.auralis.player"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId = "com.auralis.player"
        minSdk = 23
        targetSdk = 35
        // Take the version from pubspec.yaml (`version: 1.4.2+7`) through the
        // Flutter Gradle extension. Hard-coding 1/1.0.0 here silently overrode
        // the pubspec, so every earlier APK installed as 1.0.0 (code 1).
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    splits {
        abi {
            enable = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            reset()
            include "armeabi-v7a", "arm64-v8a"
            universalApk = false
        }
    }

    // Install-over guarantee: Flutter/AGP auto-offsets the versionCode per
    // ABI, and the offset varied with how the build was invoked (a build
    // once shipped arm64=2011, the next arm64=1012, which Android rejects
    // as a downgrade). Pin every split output to 3000 + the pubspec build
    // number instead: always higher than any earlier release (max 2011)
    // and strictly increasing with every version bump, for both ABIs.
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.versionCodeOverride = 3000 + flutter.versionCode
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = file(keystoreProperties['storeFile'])
                storePassword = keystoreProperties['storePassword']
                storeType = keystoreProperties['storeType'] ?: 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            } else {
                signingConfig = signingConfigs.debug
            }
        }
        debug {
            minifyEnabled = false
            shrinkResources = false
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Shade-card service only: MediaSessionCompat/MediaStyle (androidx.media)
    // and NotificationCompat (androidx.core). The system media player
    // (audio_service) does not depend on these being declared here.
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.core:core-ktx:1.13.1"
}
